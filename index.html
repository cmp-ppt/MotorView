<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://*.supabase.co; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; base-uri 'self'; form-action 'self'">
<title>MotorView CMP · Gestión de Motores Eléctricos</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23e8742a'/%3E%3Cpath d='M17 5 8 18h6l-1 9 9-13h-6z' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<aside class="side" id="side">
  <div class="brand">
    <div class="logo"><svg viewBox="0 0 32 32"><path d="M17 4 7 19h7l-1.5 9L24 12h-7z"/></svg></div>
    <div><b>MotorView</b><small>CMP · Área Eléctrica</small></div>
  </div>
  <nav>
    <button class="nav on" data-view="resumen"><svg viewBox="0 0 24 24"><path d="M3 13h8V3H3zm0 8h8v-6H3zm10 0h8V11h-8zm0-18v6h8V3z"/></svg>Resumen</button>
    <button class="nav" data-view="inventario"><svg viewBox="0 0 24 24"><path d="M3 5h18v3H3zm0 5.5h18v3H3zM3 16h18v3H3z"/></svg>Inventario</button>
    <button class="nav" data-view="disponibilidad"><svg viewBox="0 0 24 24"><path d="M12 2 4 5v6c0 5 3.4 9.700 8 11 4.600-1.300 8-6 8-11V5zm-1 14-4-4 1.400-1.400L11 13.200l4.600-4.600L17 10z"/></svg>Disponibilidad</button>
  </nav>
  <div class="faenas">
    <span class="lbl">Faena</span>
    <button class="faena on"><i></i>Planta Magnetita<em id="fCount"></em></button>
    <button class="faena off" disabled><i></i>Los Colorados<em>pronto</em></button>
    <button class="faena off" disabled><i></i>Pleito<em>pronto</em></button>
    <button class="faena off" disabled><i></i>Cerro Negro Norte<em>pronto</em></button>
    <button class="faena off" disabled><i></i>Romeral<em>pronto</em></button>
    <button class="faena off" disabled><i></i>Guayacán<em>pronto</em></button>
    <button class="faena off" disabled><i></i>Puerto Guacolda<em>pronto</em></button>
    <button class="faena off" disabled><i></i>Planta de Pellets<em>pronto</em></button>
    <button class="faena off" disabled><i></i>Puerto Punta Totoralillo<em>pronto</em></button>
  </div>
  <div class="proto">Prototipo · datos del listado Excel de Planta Magnetita. Los estados fueron inferidos de la planilla y deben validarse con Mantenimiento.</div>
</aside>

<main>
  <header class="top">
    <button class="burger" id="burger" aria-label="Menú"><svg viewBox="0 0 24 24"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg></button>
    <div><h1 id="title">Resumen</h1><p id="subtitle"></p></div>
    <div class="spacer"></div>
    <label class="search"><svg viewBox="0 0 24 24"><path d="M15.500 14h-.8l-.3-.3A6.500 6.500 0 1 0 14 15.500l.3.3v.8l5 5 1.500-1.500zm-6 0a4.500 4.500 0 1 1 0-9 4.500 4.500 0 0 1 0 9z"/></svg><input id="gsearch" placeholder="Buscar N° motor, TAG, descripción…  ( / )"></label>
    <div class="who" id="who"><span class="av" id="whoAv"></span><div><b id="whoName"></b><small id="whoRole"></small></div><button id="logout" title="Cerrar sesión" aria-label="Cerrar sesión"><svg viewBox="0 0 24 24"><path d="m17 7-1.400 1.400L18.200 11H8v2h10.200l-2.600 2.600L17 17l5-5zM4 5h8V3H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h8v-2H4z"/></svg></button></div>
    <button class="theme" id="theme" title="Cambiar tema"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9c0-.5 0-.9-.1-1.400A5.500 5.500 0 0 1 12.400 3.100 9 9 0 0 0 12 3z"/></svg></button>
  </header>

  <section class="view on" id="v-resumen"></section>
  <section class="view" id="v-inventario"></section>
  <section class="view" id="v-disponibilidad"></section>
</main>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true"></aside>
<div class="tip" id="tip"></div>

<div class="login" id="login" hidden>
  <form class="lcard" id="lform" autocomplete="on">
    <div class="logo"><svg viewBox="0 0 32 32"><path d="M17 4 7 19h7l-1.5 9L24 12h-7z"/></svg></div>
    <h2>MotorView CMP</h2>
    <p>Gestión de motores eléctricos · Compañía Minera del Pacífico</p>
    <label>Correo<input id="lu" name="username" type="email" autocomplete="username" autocapitalize="none" required></label>
    <label>Contraseña<input id="lp" name="password" type="password" autocomplete="current-password" required></label>
    <div class="lerr" id="lerr" role="alert"></div>
    <button class="btn" id="lbtn" type="submit">Ingresar</button>
  </form>
</div>

<script src="js/config.js"></script>
<script src="js/sesion.js"></script>
<script src="js/nube.js"></script>
<script src="js/boot.js"></script>
</body>
</html>
